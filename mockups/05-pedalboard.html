<title>Diego — Pedalboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============ Pedalboard — palette/font tokens arrive at runtime from #theme-data ============ */
* { box-sizing: border-box; }
:root {
  /* type scale (8 steps; micro labels bottom out at 10px) */
  --fs-2xs: .625rem;   /* 10px — hardware micro labels: jacks, knob names, abbrs */
  --fs-xs: .6875rem;   /* 11px — utility chrome: tags, kickers, buttons */
  --fs-sm: .75rem;     /* 12px — mono values */
  --fs-md: .8125rem;   /* 13px — pedal names */
  --fs-body-sm: .875rem;  /* 14px — card decks */
  --fs-body: .9375rem;    /* 15px — summaries, strip titles */
  --fs-lg: 1rem;          /* badge name */
  --fs-display: clamp(1.25rem, 2.6vw, 1.9rem);
  /* spacing ladder (2px grid) + shared gutter */
  --sp-1: 4px; --sp-2: 6px; --sp-3: 8px; --sp-4: 10px; --sp-5: 12px;
  --sp-6: 14px; --sp-7: 16px; --sp-8: 18px; --sp-9: 22px;
  --gutter: clamp(16px, 4vw, 40px);
  /* neutral shadow/sheen bases for rgba() overlays */
  --shadow-rgb: 0, 0, 0;
  --sheen-rgb: 255, 255, 255;
}
body {
  margin: 0;
  background-color: var(--tolex);
  background-image:
    radial-gradient(ellipse 130% 60% at 50% -8%, rgba(var(--sheen-rgb),.05), transparent 55%),
    repeating-linear-gradient(45deg, rgba(var(--sheen-rgb),.016) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(var(--shadow-rgb),.22) 0 2px, transparent 2px 4px);
  color: var(--boneWhite);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}
::selection { background: color-mix(in srgb, var(--surfPedal) 55%, transparent); }
button { font: inherit; }
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--surfPedal);
  outline-offset: 3px;
}
.stage { position: relative; min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- header: amp badge + way home ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background-color: var(--tolex);
  background-image:
    repeating-linear-gradient(45deg, rgba(var(--sheen-rgb),.016) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(var(--shadow-rgb),.22) 0 2px, transparent 2px 4px);
  border-bottom: 1px solid color-mix(in srgb, var(--boneWhite) 14%, transparent);
  box-shadow: 0 6px 18px rgba(var(--shadow-rgb),.35);
}
.top-inner {
  max-width: 1220px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: var(--sp-4) var(--sp-7); padding: var(--sp-4) var(--gutter);
}
.badge {
  position: relative; display: flex; flex-direction: column; gap: 1px;
  padding: 7px 20px; border-radius: 6px;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--boneWhite) 15%, var(--tolex)),
    color-mix(in srgb, var(--boneWhite) 5%, var(--tolex)));
  border: 1px solid color-mix(in srgb, var(--boneWhite) 20%, transparent);
  box-shadow: 0 2px 6px rgba(var(--shadow-rgb),.5), inset 0 1px 0 rgba(var(--sheen-rgb),.08);
}
.badge::before, .badge::after {
  content: ''; position: absolute; top: 50%; width: 5px; height: 5px;
  border-radius: 50%; transform: translateY(-50%);
  background: radial-gradient(circle at 35% 35%,
    color-mix(in srgb, var(--boneWhite) 55%, var(--cable)),
    color-mix(in srgb, var(--tolex) 70%, var(--cable)));
}
.badge::before { left: 6px; } .badge::after { right: 6px; }
.badge-name {
  font-family: var(--font-display); font-size: var(--fs-lg); letter-spacing: .1em;
  text-transform: uppercase;
  text-shadow: 0 -1px 0 rgba(var(--shadow-rgb),.85), 0 1px 0 rgba(var(--sheen-rgb),.07);
}
.badge-role {
  font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .24em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--boneWhite) 74%, var(--tolex));
}
.hub-btn {
  display: inline-flex; align-items: center; gap: var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .16em;
  color: var(--boneWhite); cursor: pointer;
  background: color-mix(in srgb, var(--boneWhite) 7%, var(--tolex));
  border: 1px solid color-mix(in srgb, var(--boneWhite) 24%, transparent);
  border-radius: 999px; padding: 8px 15px;
}
.hub-btn:hover { background: color-mix(in srgb, var(--boneWhite) 15%, var(--tolex)); }
.hub-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--surfPedal);
  box-shadow: 0 0 6px color-mix(in srgb, var(--surfPedal) 70%, transparent);
}

/* ---------- board ---------- */
.board-note {
  max-width: 1220px; margin: 0 auto; width: 100%;
  padding: 24px var(--gutter) var(--sp-1);
  font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .08em;
  color: color-mix(in srgb, var(--boneWhite) 76%, var(--tolex));
}
.board {
  max-width: 1220px; margin: 0 auto; width: 100%;
  padding: var(--sp-8) var(--gutter) var(--sp-3);
  display: grid;
  /* --board-cols is computed by the renderer from theme.motion.params.pedalRows */
  grid-template-columns: repeat(var(--board-cols, 5), minmax(0, 1fr));
  gap: clamp(14px, 2vw, 24px);
}
@media (max-width: 1100px) { .board { grid-template-columns: repeat(auto-fit, minmax(186px, 1fr)); } }
@media (max-width: 460px) { .board { grid-template-columns: 1fr; } }
/* theme.motion.params.ledGlow: false strips the halo and burst, LED still lights */
.led-glow-off .led-glow { box-shadow: none; }
.led-glow-off .led-burst { display: none; }

/* ---------- pedal ---------- */
.pedal {
  position: relative; display: block; width: 100%; max-width: 250px; margin: 0 auto;
  background: none; border: 0; padding: 0 0 8px; cursor: pointer; color: inherit;
  text-align: inherit; border-radius: 18px;
  transition: transform .18s ease;
}
.pedal:hover { transform: translateY(-3px); }
.pedal.is-open:hover { transform: none; }
.pedal:focus-visible { outline: 3px dashed var(--surfPedal); outline-offset: 6px; }
.pedal-shadow {
  position: absolute; left: 7%; right: 7%; bottom: -3px; height: 14px;
  border-radius: 50%; display: block;
  background: radial-gradient(ellipse at 50% 50%, rgba(var(--shadow-rgb),.6), transparent 70%);
}
.enclosure {
  position: relative; display: flex; flex-direction: column; gap: var(--sp-2);
  height: 240px; border-radius: 14px; padding: var(--sp-4) var(--sp-5) var(--sp-5);
  color: var(--ink);
  --knob-base: color-mix(in srgb, var(--ink) 86%, var(--finish));
  --knob-mark: var(--finish);
  background-image:
    radial-gradient(circle 2.5px at 13px 13px, rgba(var(--shadow-rgb),.38) 2px, transparent 3px),
    radial-gradient(circle 2.5px at calc(100% - 13px) 13px, rgba(var(--shadow-rgb),.38) 2px, transparent 3px),
    radial-gradient(circle 2.5px at 13px calc(100% - 13px), rgba(var(--shadow-rgb),.38) 2px, transparent 3px),
    radial-gradient(circle 2.5px at calc(100% - 13px) calc(100% - 13px), rgba(var(--shadow-rgb),.38) 2px, transparent 3px),
    linear-gradient(168deg,
      color-mix(in srgb, var(--boneWhite) 16%, var(--finish)) 0%,
      var(--finish) 42%,
      color-mix(in srgb, var(--tolex) 22%, var(--finish)) 100%);
  box-shadow: 0 12px 20px rgba(var(--shadow-rgb),.5),
              inset 0 1px 0 rgba(var(--sheen-rgb),.3),
              inset 0 -2px 4px rgba(var(--shadow-rgb),.22);
}
.led-zone { position: relative; display: flex; justify-content: center; height: 15px; flex: none; }
.led {
  position: relative; display: block; width: 11px; height: 11px; border-radius: 50%;
  background: color-mix(in srgb, var(--ledRed) 26%, var(--tolex));
  box-shadow: inset 0 1px 2px rgba(var(--shadow-rgb),.6), 0 0 0 2px rgba(var(--shadow-rgb),.28);
}
.led-glow {
  position: absolute; inset: 0; border-radius: 50%; opacity: 0; display: block;
  background: var(--ledRed);
  box-shadow: 0 0 7px 2px var(--ledRed),
              0 0 20px 6px color-mix(in srgb, var(--ledRed) 55%, transparent);
}
.led-burst {
  position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
  margin: -13px 0 0 -13px; border-radius: 50%; display: block;
  border: 2px solid var(--ledRed); opacity: 0; pointer-events: none;
}
.knob-row { display: flex; justify-content: space-between; gap: var(--sp-1); padding: 0 var(--sp-6); flex: none; }
.knob-unit { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); min-width: 0; flex: 1; }
.knob {
  position: relative; display: block; width: 32px; height: 32px; border-radius: 50%; flex: none;
  transform: rotate(var(--rot, 0deg));
  background: radial-gradient(circle at 34% 30%,
    color-mix(in srgb, var(--boneWhite) 26%, var(--knob-base)),
    var(--knob-base) 62%);
  box-shadow: 0 2px 4px rgba(var(--shadow-rgb),.4),
              inset 0 1px 1px rgba(var(--sheen-rgb),.22),
              0 0 0 2px rgba(var(--shadow-rgb),.14);
}
.knob::after {
  content: ''; position: absolute; left: calc(50% - 1px); top: 2px;
  width: 2px; height: 10px; border-radius: 1px;
  background: var(--knob-mark);
}
.knob-label {
  font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .03em;
  color: var(--ink); white-space: nowrap; overflow: hidden;
  max-width: 100%; text-overflow: ellipsis;
}
.jack { position: absolute; top: 100px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.jack-in { right: 7px; } .jack-out { left: 7px; }
.jack-nut {
  display: block; width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%,
    var(--tolex) 0 2.5px,
    color-mix(in srgb, var(--boneWhite) 45%, var(--cable)) 3px 5px,
    color-mix(in srgb, var(--tolex) 55%, var(--cable)) 5px);
  box-shadow: 0 1px 2px rgba(var(--shadow-rgb),.4);
}
.jack-tag {
  font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .06em;
  color: var(--ink); opacity: .85;
}
.pedal-name {
  margin-top: 4px; padding: 5px 20px 0; min-height: 2.3em;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: var(--fs-md); line-height: 1.2;
  letter-spacing: .06em; text-transform: uppercase; text-align: center;
}
.stomp { margin-top: auto; display: flex; justify-content: center; padding-bottom: 4px; flex: none; }
.stomp-cap {
  position: relative; display: block; width: 52px; height: 52px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%,
    color-mix(in srgb, var(--boneWhite) 65%, var(--cable)),
    color-mix(in srgb, var(--boneWhite) 20%, var(--cable)) 52%,
    color-mix(in srgb, var(--tolex) 45%, var(--cable)) 78%);
  box-shadow: 0 3px 6px rgba(var(--shadow-rgb),.45),
              inset 0 2px 3px rgba(var(--sheen-rgb),.35),
              inset 0 -3px 5px rgba(var(--shadow-rgb),.4),
              0 0 0 4px color-mix(in srgb, var(--tolex) 30%, var(--finish)),
              0 0 0 5px rgba(var(--shadow-rgb),.25);
}
.stomp-cap::after {
  content: ''; position: absolute; inset: 7px; border-radius: 50%;
  border: 1.5px dashed rgba(var(--shadow-rgb),.28);
}

/* ---------- rack panel (amp head face) ---------- */
.rack { display: none; max-width: 1220px; margin: 0 auto; width: 100%; padding: 26px var(--gutter) var(--sp-4); }
.rack.is-open { display: block; }
.panel {
  position: relative; border-radius: 12px;
  padding: 20px clamp(16px, 3vw, 32px) 26px;
  background-image:
    repeating-linear-gradient(0deg, rgba(var(--sheen-rgb),.012) 0 1px, transparent 1px 3px),
    linear-gradient(180deg,
      color-mix(in srgb, var(--boneWhite) 13%, var(--tolex)),
      color-mix(in srgb, var(--boneWhite) 7%, var(--tolex)));
  border: 1px solid color-mix(in srgb, var(--boneWhite) 20%, transparent);
  border-top: 3px solid var(--accent, var(--surfPedal));
  box-shadow: 0 18px 40px rgba(var(--shadow-rgb),.5), inset 0 1px 0 rgba(var(--sheen-rgb),.07);
}
.screw {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  transform: rotate(var(--sa, 0deg));
  background: radial-gradient(circle at 35% 30%,
    color-mix(in srgb, var(--boneWhite) 50%, var(--cable)),
    color-mix(in srgb, var(--tolex) 60%, var(--cable)));
  box-shadow: 0 1px 2px rgba(var(--shadow-rgb),.5);
}
.screw::after {
  content: ''; position: absolute; left: 1px; right: 1px; top: calc(50% - .75px);
  height: 1.5px; background: rgba(var(--shadow-rgb),.55);
}
.s-tl { top: 8px; left: 8px; } .s-tr { top: 8px; right: 8px; }
.s-bl { bottom: 8px; left: 8px; } .s-br { bottom: 8px; right: 8px; }
.panel-head { display: flex; align-items: flex-start; gap: var(--sp-8); flex-wrap: wrap; }
.pjack { position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); padding-top: 3px; }
.pjack-hole {
  display: block; width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle,
    var(--tolex) 0 4px,
    color-mix(in srgb, var(--boneWhite) 40%, var(--cable)) 4.5px 7px,
    color-mix(in srgb, var(--tolex) 50%, var(--cable)) 7.5px);
  box-shadow: 0 0 0 2px rgba(var(--shadow-rgb),.3), 0 1px 2px rgba(var(--shadow-rgb),.4);
}
.pjack-ring {
  position: absolute; left: 50%; top: 11px; width: 22px; height: 22px;
  margin: -11px 0 0 -11px; border-radius: 50%; display: block;
  border: 2px solid var(--accent, var(--surfPedal)); opacity: 0; pointer-events: none;
}
.pjack-label {
  font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .18em;
  color: color-mix(in srgb, var(--boneWhite) 70%, var(--tolex));
}
.panel-titles { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: var(--sp-2); }
.kicker {
  margin: 0; font-family: var(--font-mono); font-size: var(--fs-xs);
  letter-spacing: .2em; text-transform: uppercase;
  color: color-mix(in srgb, var(--accent, var(--surfPedal)) 35%, var(--boneWhite));
}
.headline {
  margin: 0; font-family: var(--font-display);
  font-size: var(--fs-display); line-height: 1.12; letter-spacing: .015em;
  color: var(--boneWhite); text-shadow: 0 -1px 0 rgba(var(--shadow-rgb),.6);
}
.panel-close {
  margin-left: auto; flex: none; cursor: pointer;
  font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .18em;
  color: var(--boneWhite);
  background: color-mix(in srgb, var(--boneWhite) 6%, var(--tolex));
  border: 1px solid color-mix(in srgb, var(--boneWhite) 26%, transparent);
  border-radius: 4px; padding: 8px 12px;
}
.panel-close:hover { background: color-mix(in srgb, var(--boneWhite) 14%, var(--tolex)); }
.summary {
  margin: var(--sp-6) 0 0; max-width: 66ch;
  font-size: var(--fs-body); line-height: 1.65;
  color: color-mix(in srgb, var(--boneWhite) 88%, var(--tolex));
}
.strips {
  margin-top: var(--sp-9); display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: clamp(14px, 2vw, 22px);
}
.strip {
  display: flex; flex-direction: column; gap: var(--sp-3);
  padding: var(--sp-6) var(--sp-6) var(--sp-7); border-radius: 8px;
  background: color-mix(in srgb, var(--tolex) 55%, transparent);
  border: 1px solid color-mix(in srgb, var(--boneWhite) 12%, transparent);
  border-left: 3px solid color-mix(in srgb, var(--accent, var(--surfPedal)) 65%, transparent);
  --knob-base: color-mix(in srgb, var(--tolex) 78%, var(--boneWhite));
  --knob-mark: var(--accent, var(--surfPedal));
}
.strip-top { display: flex; align-items: center; gap: var(--sp-5); }
.strip .knob { width: 27px; height: 27px; }
.strip-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.strip-abbr {
  font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .12em;
  color: color-mix(in srgb, var(--boneWhite) 62%, var(--tolex));
}
.strip-title {
  margin: 0; font-family: var(--font-display); font-size: var(--fs-body);
  line-height: 1.25; letter-spacing: .02em; color: var(--boneWhite);
}
.strip-date {
  font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .12em;
  color: color-mix(in srgb, var(--accent, var(--surfPedal)) 38%, var(--boneWhite));
}
.deck {
  margin: 0; font-size: var(--fs-body-sm); line-height: 1.6;
  color: color-mix(in srgb, var(--boneWhite) 78%, var(--tolex));
}
.tags { list-style: none; margin: auto 0 0; padding: var(--sp-2) 0 0; display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .08em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--boneWhite) 80%, var(--tolex));
  border: 1px solid color-mix(in srgb, var(--boneWhite) 22%, transparent);
  border-radius: 999px; padding: 3px 9px 3px 6px;
}
.tag-jack {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--boneWhite) 45%, var(--tolex));
  background: var(--tolex);
}

/* ---------- footer: power supply strip ---------- */
.psu { max-width: 1220px; margin: auto auto 0; width: 100%; padding: 26px var(--gutter) 34px; }
.psu-strip {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: var(--sp-7) clamp(14px, 3vw, 34px);
  border-radius: 10px; padding: var(--sp-6) clamp(14px, 2.5vw, 26px);
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--boneWhite) 10%, var(--tolex)),
    color-mix(in srgb, var(--boneWhite) 4%, var(--tolex)));
  border: 1px solid color-mix(in srgb, var(--boneWhite) 16%, transparent);
  box-shadow: 0 10px 24px rgba(var(--shadow-rgb),.4), inset 0 1px 0 rgba(var(--sheen-rgb),.06);
}
.pwr { display: flex; align-items: center; gap: var(--sp-3); }
.pwr-led {
  display: block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--burstGold);
  box-shadow: 0 0 8px color-mix(in srgb, var(--burstGold) 80%, transparent);
}
.outlet { display: flex; align-items: center; gap: var(--sp-4); min-width: 0; }
.outlet-chip { margin-left: auto; }
.socket {
  flex: none; display: block; width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle,
    color-mix(in srgb, var(--boneWhite) 55%, var(--cable)) 0 2px,
    var(--tolex) 2.5px 5px,
    color-mix(in srgb, var(--boneWhite) 30%, var(--cable)) 5.5px);
  box-shadow: 0 0 0 2px rgba(var(--shadow-rgb),.35);
}
.outlet-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.outlet-label {
  font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .22em;
  color: color-mix(in srgb, var(--boneWhite) 60%, var(--tolex));
}
.outlet-value {
  font-family: var(--font-mono); font-size: var(--fs-sm); letter-spacing: .05em;
  color: var(--boneWhite); overflow-wrap: anywhere;
}
.outlet-value a { color: inherit; text-decoration-color: color-mix(in srgb, var(--surfPedal) 60%, transparent); }
.outlet-value a:hover { text-decoration-color: var(--surfPedal); }
.chip {
  display: inline-block;
  border: 1px solid color-mix(in srgb, var(--surfPedal) 45%, transparent);
  border-radius: 999px; padding: 4px 10px;
}
.links-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.link-out {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--boneWhite); text-decoration: none;
  border: 1px solid color-mix(in srgb, var(--boneWhite) 22%, transparent);
  border-radius: 999px; padding: 3px 10px 3px 7px;
}
.link-out:hover {
  color: color-mix(in srgb, var(--surfPedal) 65%, var(--boneWhite));
  border-color: color-mix(in srgb, var(--surfPedal) 55%, transparent);
  background: color-mix(in srgb, var(--surfPedal) 8%, transparent);
}
.link-out:hover .tag-jack { border-color: color-mix(in srgb, var(--surfPedal) 75%, var(--boneWhite)); }

/* ---------- patch cable overlay ---------- */
.cable-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: visible; }
.cable-under { fill: none; stroke: rgba(var(--shadow-rgb),.45); stroke-width: 9; stroke-linecap: round; }
.cable-body { fill: none; stroke: var(--cable); stroke-width: 6.5; stroke-linecap: round; }
.cable-sheen { fill: none; stroke: color-mix(in srgb, var(--boneWhite) 30%, var(--cable)); stroke-width: 2; stroke-linecap: round; opacity: .85; }
.plug { fill: color-mix(in srgb, var(--boneWhite) 60%, var(--cable)); stroke: rgba(var(--shadow-rgb),.5); stroke-width: 1; opacity: 0; }

/* ---------- cable-tip pointer (JS gates on fine pointer + motion OK) ---------- */
.has-pointer, .has-pointer a, .has-pointer button { cursor: none; }
.cursor-dot, .cursor-ring {
  position: fixed; left: 0; top: 0; pointer-events: none; z-index: 999;
  will-change: transform;
}
.cursor-dot {
  width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%,
    var(--boneWhite),
    color-mix(in srgb, var(--boneWhite) 62%, var(--cable)));
  box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--cable) 85%, transparent),
              0 1px 3px rgba(var(--shadow-rgb),.4);
}
.cursor-dot.is-led {
  background: radial-gradient(circle at 35% 30%,
    color-mix(in srgb, var(--boneWhite) 35%, var(--ledRed)),
    var(--ledRed));
  box-shadow: 0 0 8px 2px color-mix(in srgb, var(--ledRed) 65%, transparent);
}
.cursor-ring {
  width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--boneWhite) 40%, var(--cable));
}
.cursor-ring::after {
  /* second wind of the coil */
  content: ''; position: absolute; inset: 3px; border-radius: 50%;
  border: 1.5px dashed var(--coil, var(--surfPedal)); opacity: 0;
}
.cursor-ring.is-coil { border: 2px dashed var(--coil, var(--surfPedal)); }
.cursor-ring.is-coil::after { opacity: .55; }

@media (prefers-reduced-motion: reduce) {
  .pedal { transition: none; }

        {

      "items": [

  var params = (theme.motion && theme.motion.params) || {};

  var contactLink = document.getElementById('contactLink');

  contactLink.textContent = profile.contact;
  document.getElementById('locationOut').textContent = profile.location;
  var linksRow = document.getElementById('linksRow');
  (profile.links || []).forEach(function (lnk) {
    var a = el('a', 'link-out', lnk.label);

    a.target = '_blank';
    a.rel = 'noopener';
    a.insertBefore(el('i', 'tag-jack'), a.firstChild);

  });
  document.getElementById('finishChip').textContent =
    theme.name + ' — same content.json, six finishes';

  /* ---------- build the board ---------- */
  var FINISHES = ['surfPedal', 'candyPedal', 'creamPedal', 'burstGold', 'boneWhite'];
  var stage = document.getElementById('stage');
  var board = document.getElementById('board');
  var rackEl = document.getElementById('rack');
  var panelEl = document.getElementById('panel');
  var cablePaths = [
    document.getElementById('cableUnder'),
    document.getElementById('cableBody'),
    document.getElementById('cableSheen')

  var cableBody = cablePaths[1];

  var plugB = document.getElementById('plugB');

  var blogIdx = null;

    btn.setAttribute('aria-controls', 'panel');

    enc.style.setProperty('--finish', 'var(--' + token + ')');

    var led = el('span', 'led');
    var glow = el('span', 'led-glow');
    var burst = el('span', 'led-burst');
    led.appendChild(glow);
    ledZone.appendChild(led);
    ledZone.appendChild(burst);

    var knobRow = el('span', 'knob-row');
    sec.items.slice(0, KNOBS_PER_PEDAL).forEach(function (item) {
      var unit = el('span', 'knob-unit');
      unit.appendChild(buildKnob(item.title));
      unit.appendChild(el('span', 'knob-label', abbr(item.title)));
      knobRow.appendChild(unit);
    });

    var jackOut = el('span', 'jack jack-out');
    var outNut = el('i', 'jack-nut');
    jackOut.appendChild(outNut);
    jackOut.appendChild(el('span', 'jack-tag', 'OUT'));
    var jackIn = el('span', 'jack jack-in');
    jackIn.appendChild(el('i', 'jack-nut'));
    jackIn.appendChild(el('span', 'jack-tag', 'IN'));

    var name = el('span', 'pedal-name', sec.label);
    var stomp = el('span', 'stomp');
    stomp.appendChild(el('span', 'stomp-cap'));

    enc.appendChild(ledZone);
    enc.appendChild(knobRow);
    enc.appendChild(name);
    enc.appendChild(stomp);
    enc.appendChild(jackOut);
    enc.appendChild(jackIn);
    btn.appendChild(shadow);
    btn.appendChild(enc);
    board.appendChild(btn);

    var isBlog = sec.items.some(function (it) { return it.date; });
    if (isBlog && blogIdx == null) blogIdx = i;

    btn.addEventListener('click', function () { toggle(i); });

    pedals.push({
      btn: btn, enc: enc, shadow: shadow, glow: glow, burst: burst,
      outNut: outNut, token: token, isBlog: isBlog

  });

  var panelRefs = { jackHole: null, ring: null };

    gsap.killTweensOf(panelEl.querySelectorAll('*'));
    panelEl.innerHTML = '';

    ['s-tl', 's-tr', 's-bl', 's-br'].forEach(function (pos, s) {
      var screw = el('span', 'screw ' + pos);
      screw.style.setProperty('--sa', SCREW_ANGLES[s] + 'deg');

    var pjack = el('span', 'pjack');
    var hole = el('i', 'pjack-hole');
    var ring = el('span', 'pjack-ring');
    pjack.appendChild(hole);
    pjack.appendChild(ring);
    pjack.appendChild(el('span', 'pjack-label', 'INPUT'));

    var titles = el('div', 'panel-titles');
    titles.appendChild(el('p', 'kicker', sec.kicker));
    var h2 = el('h2', 'headline', sec.headline);

    head.appendChild(titles);
    head.appendChild(closeBtn);
    panelEl.appendChild(head);
    panelEl.appendChild(el('p', 'summary', sec.summary));

    sec.items.forEach(function (item) {
      var strip = el('article', 'strip');
      var top = el('div', 'strip-top');
      top.appendChild(buildKnob(item.title));
      var id = el('div', 'strip-id');
      id.appendChild(el('span', 'strip-abbr', abbr(item.title)));
      var h3 = el('h3', 'strip-title', item.title);
      id.appendChild(h3);
      if (item.date) {

        t.className = 'strip-date';
        t.dateTime = item.date;
        t.textContent = item.date;
        id.appendChild(t);

      top.appendChild(id);
      strip.appendChild(top);
      strip.appendChild(el('p', 'deck', item.deck));
      var tags = el('ul', 'tags');
      (item.tags || []).forEach(function (tag) {

      ', ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) +
      ', ' + x2.toFixed(1) + ' ' + y2.toFixed(1);

    gsap.set(plugB, { opacity: 0 });

    tlB = gsap.timeline();
    tlB.to(cablePaths, { strokeDashoffset: 0, duration: T.cable, ease: E.cable }, 0.02);

  }

  function pointerOn() {
    if (cursor.on) return;
    cursor.on = true;
    buildCursor();
    cursor.seen = false;
    cursor.key = '';
    stage.classList.add('has-pointer');
    cursor.dot.style.display = 'block';
    cursor.ring.style.display = 'block';
    gsap.set([cursor.dot, cursor.ring], { autoAlpha: 0, x: -60, y: -60, scale: 1 });
    dotToX = gsap.quickTo(cursor.dot, 'x', { duration: 0.07, ease: 'power3.out' });
    dotToY = gsap.quickTo(cursor.dot, 'y', { duration: 0.07, ease: 'power3.out' });
    ringToX = gsap.quickTo(cursor.ring, 'x', { duration: 0.14, ease: 'power3.out' });
    ringToY = gsap.quickTo(cursor.ring, 'y', { duration: 0.14, ease: 'power3.out' });
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerover', onPointerOver);
    document.addEventListener('pointerout', onPointerOut);
    document.addEventListener('click', onCursorClick);
    document.documentElement.addEventListener('pointerleave', onDocLeave);
    document.documentElement.addEventListener('pointerenter', onDocEnter);
  }
  function pointerOff() {
    if (!cursor.on) return;
    cursor.on = false;
    stage.classList.remove('has-pointer');
    releaseCap(true);
    gsap.killTweensOf([cursor.dot, cursor.ring]);
    cursor.dot.style.display = 'none';
    cursor.ring.style.display = 'none';
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerover', onPointerOver);
    document.removeEventListener('pointerout', onPointerOut);
    document.removeEventListener('click', onCursorClick);
    document.documentElement.removeEventListener('pointerleave', onDocLeave);
    document.documentElement.removeEventListener('pointerenter', onDocEnter);
  }
  function syncPointer() { if (pointerAllowed()) { pointerOn(); } else { pointerOff(); } }
  syncPointer();
  if (fineMq.addEventListener) fineMq.addEventListener('change', syncPointer);
  if (mq.addEventListener) mq.addEventListener('change', syncPointer);

  /* ---------- power on ---------- */
  syncBlink();
  if (!reduced()) {
    var btns = pedals.map(function (p) { return p.btn; });
    var encs = pedals.map(function (p) { return p.enc; });
    gsap.fromTo(btns, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45, ease: 'none', stagger: T.stagger });
    gsap.fromTo(encs, { y: -14 }, { y: 0, duration: 0.6, ease: 'power3.out', stagger: T.stagger });
    gsap.fromTo(
      [document.getElementById('badge'), document.getElementById('boardNote'), document.getElementById('psu')],
      { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: 'none' }
    );
  }
})();
</script>
