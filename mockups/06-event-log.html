          "title": "Append-only aggregates",
          "deck": "Every change is an event with a name, a timestamp, and an author. Current state is just a fold over history.",
          "tags": ["Events", "Aggregates", "CQRS"]
        },
        {
          "title": "Rebuildable projections",
          "deck": "Read models are disposable by design. When requirements change, replay the log into a new shape and drop the old one.",
          "tags": ["Projections", "Replay", "Read models"]
        },
        {
          "title": "Schema evolution",
          "deck": "Events live forever, so they need versioning, upcasting, and a healthy respect for the ones written three years ago.",
          "tags": ["Versioning", "Upcasting", "Longevity"]
        }
      ]
    },
    {
      "id": "distributed-systems",
      "label": "Distributed Systems",
      "kicker": "Everything fails, plan for it",
      "headline": "Consistency is a spectrum, pick your point",
      "summary": "Sagas over two-phase commit, backpressure over wishful thinking, and observability deep enough that 3 a.m. incidents come with a map.",
      "items": [
        {
          "title": "Sagas and compensation",
          "deck": "Long-running workflows as a chain of local transactions, each with an undo. When step four fails, steps one through three know how to apologize.",
          "tags": ["Sagas", "Workflows", "Compensation"]
        },
        {
          "title": "Backpressure",
          "deck": "Systems should slow down gracefully instead of falling over heroically. Bounded queues, load shedding, and honest 429s.",
          "tags": ["Resilience", "Load", "Flow control"]
        },
        {
          "title": "Observability",
          "deck": "Traces that cross service boundaries, metrics with alarms that mean something, and logs you can actually search during an incident.",
          "tags": ["Tracing", "Metrics", "Alerting"]
        }
      ]
    },
    {
      "id": "iac",
      "label": "Infrastructure as Code",
      "kicker": "The environment is a program",
      "headline": "If it isn't in the repo, it doesn't exist",
      "summary": "AWS CDK stacks that build themselves through pipelines, render themselves as diagrams, and shut themselves down when nobody is looking. Infrastructure with a power button.",
      "items": [
        {
          "title": "CDK everything",
          "deck": "TypeScript stacks with constructs shaped after the domain, not the console. A new environment is a pull request, not a weekend.",
          "tags": ["CDK", "TypeScript", "AWS"]
        },
        {
          "title": "Cost-aware by design",
          "deck": "Dev and staging power off outside working hours on schedule rules. The cheapest instance is the one that is off.",
          "tags": ["FinOps", "Scheduling", "Spot"]
        },
        {
          "title": "Pipelines with gates",
          "deck": "Every stack ships through CodePipeline with manual approval where it matters and automatic rollback where it doesn't.",
          "tags": ["CI/CD", "CodePipeline", "Rollback"]
        }
      ]
    },
    {
      "id": "guitars",
      "label": "Guitars",
      "kicker": "The analog stack",
      "headline": "Latency zero, uptime whenever I feel like it",
      "summary": "Away from the keyboard I collect guitar tones and the colors that come with them: surf green offsets, seafoam Strats, candy apple reds, and sunbursts that fade like a good deploy on a Friday.",
      "items": [
        {
          "title": "The finishes",
          "deck": "Fender's custom colors were borrowed from 1950s car paint — Surf Green from Chevrolet, Candy Apple Red mixed over a gold base. Every finish is a story about an era.",
          "tags": ["Surf Green", "Candy Apple", "Sunburst"]
        },
        {
          "title": "The instruments",
          "deck": "An offset with a rosewood board for jangle, a humbucker workhorse for weight, and an acoustic dreadnought in three-tone sunburst for the porch.",
          "tags": ["Offsets", "Strats", "Acoustics"]
        },
        {
          "title": "The signal chain",
          "deck": "Tube amps on the edge of breakup, a pedalboard that grows faster than any microservice fleet, and an ongoing argument about whether true bypass matters.",
          "tags": ["Amps", "Pedals", "Tone"]
        }
      ]
    },
    {
      "id": "blog",
      "label": "Blog",
      "kicker": "Notes from the workshop",
      "headline": "Writing things down before they bite again",
      "summary": "Long-form notes on systems, infrastructure, and the occasional guitar detour. Deployed on ECS, stored cheap, and turned off at night like everything else I run.",
      "items": [
        {
          "title": "Turning the platform off at night",
          "deck": "How schedule rules and a control Lambda turned our AWS bill into a lights-out factory, and what broke the first time the lights came back on.",
          "tags": ["AWS", "FinOps"],
          "date": "2026-07-18"
        },
        {
          "title": "An outbox is a promise",
          "deck": "Exactly-once delivery does not exist, but a transactional outbox plus idempotent consumers gets close enough that nobody can tell the difference.",
          "tags": ["Event-driven", "Patterns"],
          "date": "2026-06-02"
        },
        {
          "title": "Surf Green: Fender's happiest accident",
          "deck": "A short history of the color that started on a 1957 Chevrolet, ended up on offset guitars, and eventually themed this very website.",
          "tags": ["Guitars", "Design"],
          "date": "2026-05-11"
        }
      ]
    }
  ]
}
</script>
<script type="application/json" id="theme-data">{
  "id": "event-log",
  "name": "Event Log (Lake Placid Blue)",
  "inspiration": "A developer-first site presented as an event-sourced system: the page is an append-only log, sections are projections, and opening one replays its events. The only guitar reference left is the accent — Fender Lake Placid Blue on a deep graphite stage.",
  "stage": "dark",
  "palette": {
    "stage": "#0B0E14",
    "surface": "#131A28",
    "ice": "#E8EEF7",
    "lakePlacid": "#3B72B8",
    "glow": "#7FB3E8",
    "solder": "#D9A05B"
  },
  "type": {
    "display": {
      "stack": "ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace",
      "note": "Large sentence-case mono headlines — terminal-native, not shouty"
    },
    "body": {
      "stack": "'Segoe UI', system-ui, -apple-system, sans-serif",
      "note": "Clean carrier for decks and summaries"
    },
    "utility": {
      "stack": "ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace",
      "note": "Timestamps, offsets, tags, palette hints"
    }
  },
  "motion": {
    "paradigm": "event-replay",
    "note": "Opening a section replays it: current projection compacts (lines collapse upward), then the new section's content streams in as log entries — kicker, headline, summary, items — each line sliding in with a blinking caret at the write head. A Ctrl+K command palette fuzzy-filters sections. Custom pointer: precise caret/crosshair dot with a lagging ring, morphing over interactive elements, magnetic pull on buttons, subtle glow trail.",
    "tempo": { "compact": 0.45, "streamStagger": 0.06, "lineIn": 0.35, "palette": 0.25 },
    "eases": { "compact": "power2.in", "lineIn": "power3.out" },
    "params": {
      "commandPalette": true,
      "caretBlinkSeconds": 1.1,
      "magneticRadiusPx": 80,
      "cursorRingLagSeconds": 0.14,
      "offsetsAsMetadata": "items get fake log offsets derived from JSON order"
    }
  }
}

<script>
(function () {
  'use strict';
  if (!window.gsap) return;

  var root = document.getElementById('evl-root');
  var bootBox = document.getElementById('evl-boot');
  var main = document.getElementById('evl-main');
  var foot = document.getElementById('evl-foot');
  var headReadout = document.getElementById('evl-head-readout');
  var pal = document.getElementById('evl-pal');
  var palInput = document.getElementById('evl-pal-input');
  var palList = document.getElementById('evl-pal-list');
  var palBtn = document.getElementById('evl-pal-btn');
  var scrim = document.getElementById('evl-scrim');

  var DATA, THEME;
  try {
    DATA = JSON.parse(document.getElementById('content-data').textContent);
    THEME = JSON.parse(document.getElementById('theme-data').textContent);
  } catch (err) { return; }

  /* ---------- theme -> CSS custom properties ---------- */
  function hexRgb(hex) {
    var h = String(hex).replace('#', '');
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function alpha(hex, a) {
    var c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  var PAL = THEME.palette;
  var tokens = {
    'stage': PAL.stage,
    'surface': PAL.surface,
    'ice': PAL.ice,
    'accent': PAL.lakePlacid,
    'glow': PAL.glow,
    'solder': PAL.solder,
    'ice-dim': alpha(PAL.ice, 0.62),
    'ice-faint': alpha(PAL.ice, 0.4),
    'ice-ghost': alpha(PAL.ice, 0.16),
    'line': alpha(PAL.ice, 0.12),
    'line-soft': alpha(PAL.ice, 0.07),
    'surface-hi': alpha(PAL.ice, 0.035),
    'surface-soft': alpha(PAL.surface, 0.6),
    'accent-soft': alpha(PAL.lakePlacid, 0.16),
    'accent-line': alpha(PAL.lakePlacid, 0.5),
    'glow-soft': alpha(PAL.glow, 0.3),
    'glow-faint': alpha(PAL.glow, 0.12),
    'bar-bg': alpha(PAL.stage, 0.86),
    'scrim': alpha(PAL.stage, 0.76),
    'shadow': alpha(PAL.stage, 0.66)
  };
  Object.keys(tokens).forEach(function (k) { root.style.setProperty('--evl-' + k, tokens[k]); });
  root.style.setProperty('--evl-font-display', THEME.type.display.stack);
  root.style.setProperty('--evl-font-body', THEME.type.body.stack);
  root.style.setProperty('--evl-font-utility', THEME.type.utility.stack);

  var TEMPO = THEME.motion.tempo;
  var EASES = THEME.motion.eases;
  var MP = THEME.motion.params;
  root.style.setProperty('--evl-blink', MP.caretBlinkSeconds + 's');

  /* ---------- media queries ---------- */
  function mq(q) { return window.matchMedia ? window.matchMedia(q) : { matches: false }; }
  function onMq(m, fn) {
    if (m.addEventListener) m.addEventListener('change', fn);
    else if (m.addListener) m.addListener(fn);
  }
  var mqReduce = mq('(prefers-reduced-motion: reduce)');
  var mqFine = mq('(pointer: fine)');
  function reduced() { return mqReduce.matches; }
  function syncRm() { root.classList.toggle('evl-rm', reduced()); }
  syncRm();

  /* ---------- log math: monotonic offsets + stable fake timestamps ---------- */
  /* Base write-head clock: 09:41:07.000 — fixed and plausible; never Date-derived. */
  var T_BASE = ((9 * 60 + 41) * 60 + 7) * 1000;
  var tsCache = [T_BASE];
  function tsMs(offset) {
    while (tsCache.length <= offset) {
      var i = tsCache.length;
      tsCache.push(tsCache[i - 1] + 90 + ((i * 137) % 210));
    }
    return tsCache[offset];
  }
  function pad(n, w) { return String(n).padStart(w, '0'); }
  function pad4(n) { return pad(n, 4); }
  function fmtTs(offset) {
    var ms = tsMs(offset);
    var msec = ms % 1000;
    var totalS = (ms - msec) / 1000;
    var s = totalS % 60;
    var totalM = (totalS - s) / 60;
    var m = totalM % 60;
    var h = ((totalM - m) / 60) % 24;
    return pad(h, 2) + ':' + pad(m, 2) + ':' + pad(s, 2) + '.' + pad(msec, 3);
  }

  var seq = 0;
  var bootEvents = [
    { path: 'profile/name', value: DATA.profile.name, kind: 'name' },
    { path: 'profile/role', value: DATA.profile.role, kind: 'text' },
    { path: 'profile/tagline', value: DATA.profile.tagline, kind: 'strong' },
    { path: 'profile/location', value: DATA.profile.location, kind: 'text' },
    { path: 'profile/links', links: DATA.profile.links, kind: 'links' }
  ];
  bootEvents.forEach(function (ev) { ev.offset = seq; seq += 1; });
  var sections = DATA.sections.map(function (s) {
    var meta = { section: s, offset: seq };
    seq += 1;
    meta.items = s.items.map(function (it) { var im = { item: it, offset: seq }; seq += 1; return im; });
    return meta;
  });
  var HEAD_MAX = seq - 1;
  var secById = {};
  sections.forEach(function (sm) { secById[sm.section.id] = sm; });

  /* ---------- DOM helpers ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function metaSpan(offset, path) {
    var m = el('span', 'evl-meta');
    m.appendChild(el('span', 'evl-off', pad4(offset)));
    m.appendChild(el('span', 'evl-ts', fmtTs(offset)));
    if (path) m.appendChild(el('span', 'evl-path', path));
    return m;
  }
  function linkEl(label, url) {
    var a = el('a', 'evl-link', label);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    var g = el('span', 'evl-link-glyph', ' ↗');
    g.setAttribute('aria-hidden', 'true');
    a.appendChild(g);
    return a;
  }

  /* single write-head caret, moved from line to line */
  var caret = el('span', 'evl-caret');
  caret.setAttribute('aria-hidden', 'true');
  caret.appendChild(el('span', 'evl-caret-i'));
  /* list-item host so the caret stays a valid child when the write head sits inside a <ul> */
  var caretLi = el('li', 'evl-caret-li');
  caretLi.setAttribute('aria-hidden', 'true');
  function placeCaret(afterEl) {
    if (!afterEl || !afterEl.parentNode) return;
    var mount = caret;
    if (afterEl.tagName === 'LI') {
      caretLi.appendChild(caret);
      mount = caretLi;
    } else if (caretLi.parentNode) {
      caretLi.remove();
    }
    afterEl.parentNode.insertBefore(mount, afterEl.nextSibling);
  }
  function placeCaretEnd(container) {
    var lines = container.querySelectorAll('.evl-ln');
    if (lines.length) placeCaret(lines[lines.length - 1]);
  }

  function setHead(offset) { headReadout.textContent = 'head #' + pad4(offset); }

  /* ---------- builders (all copy from parsed data) ---------- */
  function buildBootLine(ev) {
    var line = el('div', 'evl-ln evl-boot-ln');
    line.appendChild(metaSpan(ev.offset, ev.path));
    var val;
    if (ev.kind === 'name') {
      val = el('h1', 'evl-boot-name', ev.value);
    } else if (ev.kind === 'links') {
      val = el('span', 'evl-boot-val evl-boot-links');
      ev.links.forEach(function (lk, i) {
        if (i) val.appendChild(el('span', 'evl-sep', '·'));
        val.appendChild(linkEl(lk.label, lk.url));
      });
    } else {
      val = el('p', 'evl-boot-val' + (ev.kind === 'strong' ? ' evl-boot-strong' : ''), ev.value);
    }
    line.appendChild(val);
    return line;
  }

  function buildTopics() {
    var wrap = el('div', 'evl-topics');
    var head = el('div', 'evl-ln evl-topics-head');
    head.appendChild(el('h2', 'evl-eyebrow', 'topics'));
    head.appendChild(el('span', 'evl-eyebrow-meta',
      sections.length + ' projections · ' + (HEAD_MAX + 1) + ' events · select a topic to replay it'));
    wrap.appendChild(head);

    var scroller = el('div', 'evl-scrollx');
    var list = el('ul', 'evl-rows');

    var cols = el('li', 'evl-ln evl-cols');
    cols.setAttribute('aria-hidden', 'true');
    ['offset · time', 'topic', 'events', 'tags', ''].forEach(function (c) {
      cols.appendChild(el('span', null, c));
    });
    list.appendChild(cols);

    sections.forEach(function (sm) {
      var s = sm.section;
      var li = el('li', 'evl-ln evl-rowli');
      var btn = el('button', 'evl-row evl-mag');
      btn.type = 'button';
      btn.setAttribute('data-sec', s.id);

      var meta = el('span', 'evl-row-meta');
      meta.appendChild(el('span', 'evl-off', pad4(sm.offset)));
      meta.appendChild(el('span', 'evl-ts', fmtTs(sm.offset)));

      var mainCol = el('span', 'evl-row-main');
      mainCol.appendChild(el('span', 'evl-row-label', s.label));
      mainCol.appendChild(el('span', 'evl-row-kicker', s.kicker));

      var count = el('span', 'evl-row-count', s.items.length + ' events');

      var tags = el('span', 'evl-row-tags');
      var uniq = [];
      s.items.forEach(function (it) {
        (it.tags || []).forEach(function (tg) { if (uniq.indexOf(tg) === -1) uniq.push(tg); });
      });
      uniq.slice(0, 4).forEach(function (tg) { tags.appendChild(el('span', 'evl-tag', '[' + tg + ']')); });
      if (uniq.length > 4) tags.appendChild(el('span', 'evl-tag evl-tag-more', '+' + (uniq.length - 4)));

      var glyph = el('span', 'evl-row-glyph', '▸');
      glyph.setAttribute('aria-hidden', 'true');

      btn.appendChild(meta);
      btn.appendChild(mainCol);
      btn.appendChild(count);
      btn.appendChild(tags);
      btn.appendChild(glyph);
      li.appendChild(btn);
      list.appendChild(li);
    });

    scroller.appendChild(list);
    wrap.appendChild(scroller);
    return wrap;
  }

  function buildSection(sm) {
    var s = sm.section;
    var wrap = el('div', 'evl-proj');

    var back = el('button', 'evl-btn evl-back evl-mag evl-ln');
    back.type = 'button';
    var arrow = el('span', null, '⟵');
    arrow.setAttribute('aria-hidden', 'true');
    back.appendChild(arrow);
    back.appendChild(el('span', null, 'back to topics'));
    back.appendChild(el('span', 'evl-kbd', 'esc'));
    wrap.appendChild(back);

    var head = el('div', 'evl-proj-head');
    var meta = el('div', 'evl-ln');
    meta.appendChild(metaSpan(sm.offset, 'topic/' + s.id));
    head.appendChild(meta);
    head.appendChild(el('p', 'evl-ln evl-kicker', s.kicker));
    head.appendChild(el('h2', 'evl-ln evl-headline', s.headline));
    head.appendChild(el('p', 'evl-ln evl-summary', s.summary));
    wrap.appendChild(head);

    var entries = el('div', 'evl-entries');
    sm.items.forEach(function (im, i) {
      var it = im.item;
      var art = el('article', 'evl-entry');
      art.setAttribute('data-off', String(im.offset));
      var emeta = el('div', 'evl-ln');
      emeta.appendChild(metaSpan(im.offset, s.id + '/' + (i + 1)));
      art.appendChild(emeta);
      art.appendChild(el('h3', 'evl-ln evl-entry-title', it.title));
      art.appendChild(el('p', 'evl-ln evl-entry-deck', it.deck));
      var trow = el('div', 'evl-ln evl-entry-tags');
      if (it.date) trow.appendChild(el('span', 'evl-date', it.date));
      (it.tags || []).forEach(function (tg) { trow.appendChild(el('span', 'evl-tag', '[' + tg + ']')); });
      art.appendChild(trow);
      entries.appendChild(art);
    });
    wrap.appendChild(entries);

    wrap.appendChild(el('div', 'evl-ln evl-tail',
      'end of stream · ' + sm.items.length + ' events replayed · esc returns to topics'));
    return wrap;
  }

  function buildFooter() {
    var inner = el('div', 'evl-foot-inner');
    var mail = el('a', 'evl-link', DATA.profile.contact);
    mail.href = 'mailto:' + DATA.profile.contact;
    inner.appendChild(mail);
    DATA.profile.links.forEach(function (lk) { inner.appendChild(linkEl(lk.label, lk.url)); });
    inner.appendChild(el('span', 'evl-foot-spacer'));
    inner.appendChild(el('span', 'evl-chip', 'Event Log — same content.json, six finishes'));
    foot.appendChild(inner);
  }

  /* ---------- view transitions: compact, then replay ---------- */
  var view = 'boot';
  var openId = null;
  var currentTl = null;

  function killCurrent() {
    if (currentTl) { currentTl.kill(); currentTl = null; }
    var nodes = main.querySelectorAll('*');
    if (nodes.length) gsap.killTweensOf(nodes);
    gsap.killTweensOf(main);
    gsap.killTweensOf(caret);
    if (magnetEl && !magnetEl.isConnected) { magnetEl = null; magnetBase = null; }
  }

  function ensureVisible() {
    if (main.getBoundingClientRect().top < 0 && main.scrollIntoView) main.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  /* Focus a control the moment its log line has streamed in (immediately when not animating). */
  function focusLine(tl, node, target) {
    if (!target) return;
    if (!tl) { target.focus({ preventScroll: true }); return; }
    var lines = Array.prototype.slice.call(node.querySelectorAll('.evl-ln'));
    var host = target.closest('.evl-ln') || target;
    var idx = lines.indexOf(host);
    var at = idx < 0 ? TEMPO.lineIn : idx * TEMPO.streamStagger + TEMPO.lineIn;
    tl.call(function () {
      if (target.isConnected) target.focus({ preventScroll: true });
    }, null, Math.min(at, tl.duration()));
  }

  function streamInto(container) {
    var lines = container.querySelectorAll('.evl-ln');
    gsap.set(lines, { opacity: 0, y: 14 });
    gsap.set(caret, { opacity: 1 });
    var tl = gsap.timeline();
    lines.forEach(function (ln, i) {
      var at = i * TEMPO.streamStagger;
      tl.call(placeCaret, [ln], at);
      tl.to(ln, { opacity: 1, y: 0, duration: TEMPO.lineIn, ease: EASES.lineIn }, at);
    });
    return tl;
  }

  function crossTo(node, after) {
    killCurrent();
    caret.remove();
    var place = function () {
      main.textContent = '';
      main.appendChild(node);
    };
    if (reduced()) {
      gsap.set(main, { opacity: 0 });
      place();
      placeCaretEnd(node);
      gsap.set(caret, { opacity: 1 });
      currentTl = gsap.timeline();
      currentTl.to(main, { opacity: 1, duration: 0.18, ease: 'power1.out' });
      if (after) after(null);
      return;
    }
    var startStream = function () {
      gsap.set(main, { opacity: 1 });
      place();
      currentTl = streamInto(node);
      if (after) after(currentTl);
    };
    var old = main.querySelectorAll('.evl-ln');
    if (old.length) {
      currentTl = gsap.timeline({ onComplete: startStream });
      currentTl.to(old, {
        opacity: 0, y: -16,
        duration: TEMPO.compact, ease: EASES.compact,
        stagger: { each: 0.012, from: 'start' }
      }, 0);
    } else {
      startStream();
    }
  }

  /* Scroll to and briefly highlight one entry once its lines have streamed in. */
  var hitTimer = null;
  function revealEntry(tl, entry) {
    var run = function () {
      if (!entry.isConnected) return;
      if (entry.scrollIntoView) entry.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' });
      entry.classList.add('evl-entry-hit');
      if (hitTimer) window.clearTimeout(hitTimer);
      hitTimer = window.setTimeout(function () {
        entry.classList.remove('evl-entry-hit');
        hitTimer = null;
      }, 1600);
    };
    if (!tl) { run(); return; }
    tl.call(run, null, tl.duration());
  }

  function openSection(id, evtOffset) {
    var sm = secById[id];
    if (!sm) return;
    openId = id;
    view = 'section';
    var node = buildSection(sm);
    crossTo(node, function (tl) {
      setHead(sm.items.length ? sm.items[sm.items.length - 1].offset : sm.offset);
      ensureVisible();
      focusLine(tl, node, node.querySelector('.evl-back'));
      if (evtOffset != null) {
        var hit = node.querySelector('.evl-entry[data-off="' + evtOffset + '"]');
        if (hit) revealEntry(tl, hit);
      }
    });
  }

  function goTopics() {
    var backTo = openId;
    openId = null;
    view = 'topics';
    var node = buildTopics();
    crossTo(node, function (tl) {
      setHead(HEAD_MAX);
      ensureVisible();
      var target = backTo ? node.querySelector('[data-sec="' + backTo + '"]') : null;
      if (!target) target = node.querySelector('.evl-row');
      focusLine(tl, node, target);
    });
  }

  /* ---------- boot sequence ---------- */
  function intro() {
    bootEvents.forEach(function (ev) { bootBox.appendChild(buildBootLine(ev)); });
    var topics = buildTopics();
    main.appendChild(topics);
    buildFooter();
    setHead(HEAD_MAX);
    view = 'topics';

    if (reduced()) {
      placeCaretEnd(topics);
      gsap.set(caret, { opacity: 1 });
      var frame = root.querySelector('.evl-frame');
      gsap.set(frame, { opacity: 0 });
      gsap.to(frame, { opacity: 1, duration: 0.2, ease: 'power1.out' });
      return;
    }
    var bootLines = bootBox.querySelectorAll('.evl-ln');
    var mainLines = topics.querySelectorAll('.evl-ln');
    gsap.set(bootLines, { opacity: 0, y: 14 });
    gsap.set(mainLines, { opacity: 0, y: 14 });
    var tl = gsap.timeline();
    bootLines.forEach(function (ln, i) {
      var at = 0.15 + i * 0.16;
      tl.call(placeCaret, [ln], at);
      tl.to(ln, { opacity: 1, y: 0, duration: TEMPO.lineIn, ease: EASES.lineIn }, at);
    });
    var base = 0.15 + bootLines.length * 0.16 + 0.2;
    mainLines.forEach(function (ln, i) {
      var at = base + i * TEMPO.streamStagger;
      tl.call(placeCaret, [ln], at);
      tl.to(ln, { opacity: 1, y: 0, duration: TEMPO.lineIn, ease: EASES.lineIn }, at);
    });
    currentTl = tl;
  }

  /* ---------- command palette ---------- */
  var palOpen = false;
  var palLastFocus = null;
  var palResults = [];
  var palActive = 0;

  var palIndex = [];
  sections.forEach(function (sm) {
    palIndex.push({ type: 'topic', label: sm.section.label, sub: sm.section.kicker, id: sm.section.id, offset: sm.offset });
    sm.items.forEach(function (im) {
      palIndex.push({ type: 'event', label: im.item.title, sub: sm.section.label, id: sm.section.id, offset: im.offset });
    });
  });

  function fuzzy(query, text) {
    var q = query.toLowerCase();
    var t = text.toLowerCase();
    var indices = [];
    var ti = 0, score = 0, streak = 0;
    for (var qi = 0; qi < q.length; qi++) {
      var ch = q.charAt(qi);
      if (ch === ' ') { streak = 0; continue; }
      var found = t.indexOf(ch, ti);
      if (found === -1) return null;
      if (indices.length && found === ti) { streak += 1; score += 3 + streak; }
      else { streak = 0; score += 1; }
      if (found === 0) score += 4;
      else if (' -_/.'.indexOf(t.charAt(found - 1)) !== -1) score += 3;
      score -= (found - ti) * 0.05;
      indices.push(found);
      ti = found + 1;
    }
    return { score: score, indices: indices };
  }

  function highlightInto(node, text, hits) {
    if (!hits || !hits.length) { node.textContent = text; return; }
    var set = {};
    hits.forEach(function (i) { set[i] = true; });
    var i = 0;
    while (i < text.length) {
      var on = !!set[i];
      var j = i;
      while (j < text.length && !!set[j] === on) j += 1;
      var chunk = text.slice(i, j);
      if (on) node.appendChild(el('mark', 'evl-hl', chunk));
      else node.appendChild(document.createTextNode(chunk));
      i = j;
    }
  }

  function setPalActive(i) {
    if (!palResults.length) { palInput.setAttribute('aria-activedescendant', ''); return; }
    palActive = Math.max(0, Math.min(i, palResults.length - 1));
    var opts = palList.querySelectorAll('.evl-pal-opt');
    opts.forEach(function (o, k) {
      var on = k === palActive;
      o.classList.toggle('evl-active', on);
      o.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var act = opts[palActive];
    if (act) {
      palInput.setAttribute('aria-activedescendant', act.id);
      if (act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
    }
  }

  function renderPal(qraw) {
    palList.textContent = '';
    var q = (qraw || '').trim();
    var res = [];
    palIndex.forEach(function (en, i) {
      if (!q) {
        if (en.type === 'topic') res.push({ en: en, hits: null, score: -i });
        return;
      }
      var m = fuzzy(q, en.label);
      if (m) res.push({ en: en, hits: m.indices, score: m.score + (en.type === 'topic' ? 2 : 0) - i * 0.001 });
    });
    res.sort(function (a, b) { return b.score - a.score; });
    palResults = res.slice(0, 12);
    if (!palResults.length) {
      var empty = el('li', 'evl-pal-empty', 'no matches in the log — clear the filter or press esc');
      empty.setAttribute('role', 'presentation');
      palList.appendChild(empty);
      setPalActive(0);
      return;
    }
    palResults.forEach(function (r, i) {
      var li = el('li');
      li.setAttribute('role', 'presentation');
      var b = el('button', 'evl-pal-opt evl-mag');
      b.type = 'button';
      b.id = 'evl-opt-' + i;
      b.tabIndex = -1;
      b.setAttribute('role', 'option');
      b.setAttribute('data-idx', String(i));
      b.setAttribute('aria-selected', 'false');
      b.appendChild(el('span', 'evl-pal-kind' + (r.en.type === 'event' ? ' evl-is-evt' : ''), r.en.type));
      var label = el('span', 'evl-pal-label');
      highlightInto(label, r.en.label, r.hits);
      b.appendChild(label);
      b.appendChild(el('span', 'evl-pal-sub', pad4(r.en.offset) + ' · ' + r.en.sub));
      li.appendChild(b);
      palList.appendChild(li);
    });
    setPalActive(0);
  }

  function openPalette() {
    if (palOpen) return;
    palOpen = true;
    palLastFocus = document.activeElement;
    scrim.classList.remove('evl-hidden');
    pal.classList.remove('evl-hidden');
    palInput.value = '';
    renderPal('');
    gsap.killTweensOf([pal, scrim]);
    if (reduced()) {
      gsap.fromTo([scrim, pal], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out' });
    } else {
      gsap.fromTo(scrim, { opacity: 0 }, { opacity: 1, duration: TEMPO.palette, ease: 'power1.out' });
      gsap.fromTo(pal, { opacity: 0, y: 10, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: TEMPO.palette, ease: EASES.lineIn });
    }
    palInput.focus();
  }

  function closePalette(restore) {
    if (!palOpen) return;
    palOpen = false;
    gsap.killTweensOf([pal, scrim]);
    gsap.to([pal, scrim], {
      opacity: 0,
      duration: reduced() ? 0.1 : TEMPO.palette * 0.7,
      ease: 'power1.in',
      onComplete: function () {
        pal.classList.add('evl-hidden');
        scrim.classList.add('evl-hidden');
      }
    });
    if (restore) {
      if (palLastFocus && document.contains(palLastFocus) && palLastFocus.focus) palLastFocus.focus({ preventScroll: true });
      else palBtn.focus({ preventScroll: true });
    }
  }

  function togglePalette() { if (palOpen) closePalette(true); else openPalette(); }

  function choosePal(i) {
    var r = palResults[i];
    if (!r) return;
    closePalette(false);
    openSection(r.en.id, r.en.type === 'event' ? r.en.offset : null);
  }

  /* ---------- events ---------- */
  main.addEventListener('click', function (e) {
    var row = e.target.closest('.evl-row');
    if (row) { openSection(row.getAttribute('data-sec')); return; }
    if (e.target.closest('.evl-back')) goTopics();
  });

  palBtn.addEventListener('click', togglePalette);
  scrim.addEventListener('click', function () { closePalette(true); });

  palList.addEventListener('click', function (e) {
    var b = e.target.closest('.evl-pal-opt');
    if (b) choosePal(parseInt(b.getAttribute('data-idx'), 10));
  });

  palInput.addEventListener('input', function () { renderPal(palInput.value); });

  pal.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') { e.preventDefault(); palInput.focus(); return; }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setPalActive(palActive + 1 >= palResults.length ? 0 : palActive + 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setPalActive(palActive - 1 < 0 ? palResults.length - 1 : palActive - 1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      choosePal(palActive);
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      togglePalette();
      return;
    }
    if (e.key === 'Escape') {
      if (palOpen) { e.preventDefault(); closePalette(true); return; }
      if (view === 'section') { e.preventDefault(); goTopics(); }
    }
  });

  /* ---------- modern pointer: caret dot + lagging ring + glow trail ---------- */
  var ptr = { active: false, built: false, seen: false, inside: false, x: -100, y: -100 };
  var dotW, ringW, ghosts = [];
  var dotSetX, dotSetY, ringToX, ringToY;
  var ghostIdx = 0, lastGx = 0, lastGy = 0;
  var magnetEl = null, magnetBase = null;

  function curEl(cls, innerCls) {
    var w = el('div', 'evl-cur ' + cls);
    w.setAttribute('aria-hidden', 'true');
    w.appendChild(el('span', innerCls));
    return w;
  }

  function buildCursor() {
    dotW = el('div', 'evl-cur evl-cur-dot');
    dotW.setAttribute('aria-hidden', 'true');
    var di = el('span', 'evl-cur-dot-i');
    di.appendChild(el('span', 'evl-cur-bar-v'));
    di.appendChild(el('span', 'evl-cur-bar-h'));
    dotW.appendChild(di);
    ringW = curEl('evl-cur-ring', 'evl-cur-ring-i');
    for (var i = 0; i < 3; i++) ghosts.push(curEl('evl-cur-ghost', 'evl-cur-ghost-i'));
    var frag = document.createDocumentFragment();
    ghosts.forEach(function (g) { frag.appendChild(g); });
    frag.appendChild(ringW);
    frag.appendChild(dotW);
    root.appendChild(frag);
    gsap.set([dotW, ringW].concat(ghosts), { xPercent: -50, yPercent: -50, opacity: 0 });
  }

  function acquireMagnet(t) {
    if (magnetEl === t) return;
    releaseMagnet(false);
    magnetEl = t;
    var tx = parseFloat(gsap.getProperty(t, 'x')) || 0;
    var ty = parseFloat(gsap.getProperty(t, 'y')) || 0;
    var r = t.getBoundingClientRect();
    /* Inside a scroll container, cap the pull to the slack before its right/bottom
       edge so a magnetized row can never spawn a stray scrollbar. */
    var capX = 9, capY = 9;
    var holder = t.closest('.evl-scrollx, .evl-pal-list');
    if (holder) {
      var h = holder.getBoundingClientRect();
      capX = Math.min(capX, Math.max(0, h.right - (r.right - tx)));
      capY = Math.min(capY, Math.max(0, h.bottom - (r.bottom - ty)));
    }
    magnetBase = {
      x: r.left + r.width / 2 - tx,
      y: r.top + r.height / 2 - ty,
      hw: r.width / 2,
      hh: r.height / 2,
      capX: capX,
      capY: capY
    };
  }
  function updateMagnet() {
    if (!magnetEl) return;
    if (!magnetEl.isConnected) { magnetEl = null; magnetBase = null; return; }
    var dx = ptr.x - magnetBase.x;
    var dy = ptr.y - magnetBase.y;
    /* engage by distance to the element's rectangle, not its center, so wide
       rows respond along their whole length */
    var gx = Math.max(0, Math.abs(dx) - magnetBase.hw);
    var gy = Math.max(0, Math.abs(dy) - magnetBase.hh);
    if (Math.hypot(gx, gy) > MP.magneticRadiusPx) { releaseMagnet(true); return; }
    var ox = dx * 0.22, oy = dy * 0.22;
    var m = Math.hypot(ox, oy);
    if (m > 9) { ox *= 9 / m; oy *= 9 / m; }
    ox = Math.max(-magnetBase.capX, Math.min(magnetBase.capX, ox));
    oy = Math.max(-magnetBase.capY, Math.min(magnetBase.capY, oy));
    gsap.to(magnetEl, { x: ox, y: oy, duration: 0.3, ease: 'power3.out', overwrite: 'auto' });
  }
  function releaseMagnet(spring) {
    if (!magnetEl) return;
    var t = magnetEl;
    magnetEl = null;
    magnetBase = null;
    if (!t.isConnected) return;
    gsap.to(t, { x: 0, y: 0, duration: spring ? 0.55 : 0.3, ease: spring ? 'elastic.out(1, 0.5)' : 'power2.out', overwrite: 'auto' });
  }

  function onPtrMove(e) {
    ptr.x = e.clientX;
    ptr.y = e.clientY;
    ptr.inside = true;
    if (!ptr.seen) {
      ptr.seen = true;
      lastGx = ptr.x;
      lastGy = ptr.y;
      gsap.set([dotW, ringW], { x: ptr.x, y: ptr.y });
      gsap.to([dotW, ringW], { opacity: 1, duration: 0.2 });
    }
    dotSetX(ptr.x);
    dotSetY(ptr.y);
    ringToX(ptr.x);
    ringToY(ptr.y);
    if (magnetEl) updateMagnet();
  }
  function onPtrOver(e) {
    var t = e.target.closest('a, button');
    if (!t) return;
    root.classList.add('evl-cur-hot');
    if (t.classList.contains('evl-mag')) acquireMagnet(t);
  }
  function onPtrOut(e) {
    var rel = e.relatedTarget;
    var still = rel && rel.closest ? rel.closest('a, button') : null;
    if (!still) root.classList.remove('evl-cur-hot');
  }
  function onDocLeave() {
    ptr.inside = false;
    if (ptr.seen) gsap.to([dotW, ringW], { opacity: 0, duration: 0.15 });
    releaseMagnet(true);
  }
  function onDocEnter() {
    ptr.inside = true;
    if (ptr.seen) gsap.to([dotW, ringW], { opacity: 1, duration: 0.15 });
  }
  function trailTick() {
    if (!ptr.seen || !ptr.inside) return;
    var dx = ptr.x - lastGx;
    var dy = ptr.y - lastGy;
    if (dx * dx + dy * dy > 900) {
      lastGx = ptr.x;
      lastGy = ptr.y;
      var g = ghosts[ghostIdx % ghosts.length];
      ghostIdx += 1;
      gsap.killTweensOf(g);
      gsap.set(g, { x: ptr.x, y: ptr.y, opacity: 0.3 });
      gsap.to(g, { opacity: 0, duration: 0.45, ease: 'power1.out' });
    }
  }

  function enablePointer() {
    if (ptr.active) return;
    if (!ptr.built) { buildCursor(); ptr.built = true; }
    ptr.active = true;
    root.classList.add('evl-has-pointer');
    dotSetX = gsap.quickSetter(dotW, 'x', 'px');
    dotSetY = gsap.quickSetter(dotW, 'y', 'px');
    ringToX = gsap.quickTo(ringW, 'x', { duration: MP.cursorRingLagSeconds, ease: 'power3' });
    ringToY = gsap.quickTo(ringW, 'y', { duration: MP.cursorRingLagSeconds, ease: 'power3' });
    window.addEventListener('pointermove', onPtrMove, { passive: true });
    root.addEventListener('pointerover', onPtrOver);
    root.addEventListener('pointerout', onPtrOut);
    document.documentElement.addEventListener('pointerleave', onDocLeave);
    document.documentElement.addEventListener('pointerenter', onDocEnter);
    gsap.ticker.add(trailTick);
  }
  function disablePointer() {
    root.classList.remove('evl-has-pointer');
    root.classList.remove('evl-cur-hot');
    if (!ptr.active) return;
    ptr.active = false;
    ptr.seen = false;
    window.removeEventListener('pointermove', onPtrMove);
    root.removeEventListener('pointerover', onPtrOver);
    root.removeEventListener('pointerout', onPtrOut);
    document.documentElement.removeEventListener('pointerleave', onDocLeave);
    document.documentElement.removeEventListener('pointerenter', onDocEnter);
    gsap.ticker.remove(trailTick);
    releaseMagnet(false);
    var els = [dotW, ringW].concat(ghosts);
    gsap.killTweensOf(els);
    gsap.set(els, { opacity: 0 });
  }
  function syncPointer() {
    if (mqFine.matches && !reduced()) enablePointer();
    else disablePointer();
  }

  onMq(mqReduce, function () { syncRm(); syncPointer(); });
  onMq(mqFine, syncPointer);
  syncPointer();

  /* ---------- go ---------- */
  intro();
})();
</script>
